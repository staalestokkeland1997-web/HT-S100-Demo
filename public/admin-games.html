<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Game Settings | Hatteland Challenge</title>
    <style>
      :root {
        --bg: #02070d;
        --text: #f4fbff;
        --muted: #8fa8b8;
        --line: rgba(160, 214, 236, 0.14);
        --blue: #4fe3ff;
        --gold: #f5c84b;
        --red: #ff5d6c;
        --green: #68f2a6;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 16% 10%, rgba(79, 227, 255, 0.11), transparent 34rem),
          linear-gradient(150deg, #04121d 0%, #02070d 62%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
        color: inherit;
      }

      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: clamp(18px, 3vmin, 40px);
        display: grid;
        gap: clamp(16px, 2.4vmin, 28px);
      }

      .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .eyebrow {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3.4vmin, 38px);
        font-weight: 800;
        letter-spacing: -0.025em;
      }

      .link-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .ghost {
        min-height: 44px;
        padding: 0 16px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .login {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
        padding: clamp(16px, 2.4vmin, 26px);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
      }

      .field {
        display: grid;
        gap: 6px;
        min-width: 220px;
      }

      .field span {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input[type="password"],
      input[type="number"] {
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        font-size: 15px;
      }

      .primary {
        min-height: 48px;
        padding: 0 26px;
        border-radius: 10px;
        background: linear-gradient(120deg, var(--blue), #2bb8e0);
        color: #06202b;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .danger {
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid rgba(255, 93, 108, 0.4);
        border-radius: 10px;
        background: transparent;
        color: #ffdce1;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .message {
        margin: 0;
        min-height: 20px;
        font-size: 13px;
        font-weight: 700;
        color: var(--gold);
      }

      .games {
        display: grid;
        gap: clamp(14px, 2vmin, 22px);
      }

      .hidden {
        display: none;
      }

      .game-card {
        display: grid;
        gap: 16px;
        padding: clamp(16px, 2.4vmin, 28px);
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
      }

      .game-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }

      .game-head h2 {
        margin: 0;
        font-size: clamp(17px, 2.2vmin, 24px);
        font-weight: 800;
      }

      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        padding: 5px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .badge--active {
        border-color: rgba(104, 242, 166, 0.44);
        color: var(--green);
      }

      .game-body {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(240px, 1fr);
        gap: clamp(14px, 2vmin, 24px);
        align-items: start;
      }

      @media (max-width: 900px) {
        .game-body {
          grid-template-columns: 1fr;
        }
      }

      .presets {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .preset {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
      }

      .toggles {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .toggle input {
        width: 22px;
        height: 22px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .board {
        display: grid;
        gap: 8px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .board > span {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .board ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
      }

      .board li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
      }

      .board li b {
        font-variant-numeric: tabular-nums;
        color: var(--gold);
      }

      .note {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  <script src="/kiosk-lock.js"></script>
</head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">Kiosk operations</p>
          <h1>Game settings and high scores</h1>
        </div>
        <div class="link-row">
          <a class="ghost" href="/admin.html">Admin home</a>
          <a class="ghost" href="/status.html">Status</a>
          <a class="ghost" href="/select.html">Game kiosk</a>
        </div>
      </header>

      <form class="login" id="loginForm">
        <label class="field">
          <span>Admin password</span>
          <input id="passwordInput" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary" type="submit">Unlock</button>
        <button class="ghost" id="refreshButton" type="button">Refresh</button>
      </form>

      <p class="message" id="adminMessage" aria-live="polite"></p>

      <section class="games hidden" id="gameList"></section>
    </main>

    <script src="/admin-games.js?v=20260805a"></script>
  </body>
</html>
