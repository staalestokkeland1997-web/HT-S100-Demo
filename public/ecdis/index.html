<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hatteland Technology — HT ECDIS</title>
<meta name="theme-color" content="#0a0e14">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link href="vendor/fonts/inter.css" rel="stylesheet">
<script src="./kiosk.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#0a0e14;color:#f5f5f7;overflow:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;transition:opacity .5s ease;}
  .logo{height:34px;width:auto;margin-bottom:22px;filter:brightness(0) invert(1);opacity:.92;}
  h1{font-size:26px;font-weight:700;margin:0 0 28px;}
  .ring{width:46px;height:46px;border-radius:50%;border:3px solid #1f2530;border-top-color:#0A84FF;
    animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .status{margin-top:20px;font-size:13px;color:#9aa0aa;min-height:18px;}
  .alt{margin-top:34px;font-size:13px;}
  .alt a{color:#0A84FF;text-decoration:none;}
  .alt a:hover{text-decoration:underline;}
</style>
<script src="/kiosk-lock.js"></script>
<script src="/fullscreen.js" defer></script>
</head>
<body>
  <div class="load" id="load">
    <img class="logo" src="uploads/HT_Main_Logo_Black_Web.svg" alt="Hatteland Technology">
    <h1>HT ECDIS</h1>
    <div class="ring" aria-hidden="true"></div>
    <div class="status" id="status" aria-live="polite">Loading chart engine…</div>
    <div class="alt">
      <a href="./ht-ecdis.html">open now</a>
      · or open the <a href="./helm-console.html">Helm Console</a> demo
    </div>
  </div>

<script>
  // Carry the query string (notably ?kiosk=1) through to the demo.
  var TARGET = "./ht-ecdis.html" + location.search;
  // Etter forste boot gaar kiosken rett i appen - ingen lasteskjerm.
  var skipBoot = false;
  try { skipBoot = !!localStorage.getItem("mrd_boot"); } catch (e) {}
  if (skipBoot) {
    document.getElementById("load").style.display = "none";
    window.location.replace(TARGET);
  }
  if (location.search) {
    var links = document.querySelectorAll(".alt a");
    for (var k = 0; k < links.length; k++) links[k].href = links[k].getAttribute("href") + location.search;
  }
  var steps = [
    "Loading chart engine…",
    "Connecting to live chart sources…",
    "Initialising ECDIS portrayal…",
    "Opening HT ECDIS…"
  ];
  var i = 0, el = document.getElementById("status");
  var t = setInterval(function(){
    i++;
    if (i < steps.length) el.textContent = steps[i];
  }, 650);

  // Warm the target so the heavy demo is cached before we navigate.
  fetch(TARGET, { cache: "force-cache" }).catch(function(){});

  function go(){
    try { localStorage.setItem("mrd_boot", "1"); } catch (e) {}
    clearInterval(t);
    var load = document.getElementById("load");
    load.style.opacity = "0";
    setTimeout(function(){ window.location.replace(TARGET); }, 480);
  }
  // Give the loading screen a moment, then navigate.
  setTimeout(go, 2400);
</script>
</body>
</html>
