<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hatteland Technology — HT Radar</title>
<meta name="theme-color" content="#050607">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="vendor/fonts/inter.css" rel="stylesheet">
<script src="./kiosk.js"></script>
<style>
  /* Fosfor-palett som CSS-variabler: GRN er standard, AMB overstyres via html[data-pal]. */
  :root{
    --rt:#b7f7cf; --rm:#9fd8bb; --rd:#48685c; --bd:#1b2622; --bd2:#23342d;
    --kb1:#141a17; --kb2:#0c100e; --on1:#14532d; --on2:#0c2e1c; --onc:#6ef2a6; --onbd:#1f7a45;
    --accent:#34d27b; --panel1:#0b0e10; --panel2:#07090b; --boxbg:#0a0d0e; --danger:#ff6b61; --warn:#fbbf24;
  }
  html[data-pal="AMB"]{
    --rt:#ffe2b0; --rm:#f5cd8f; --rd:#6e5a38; --bd:#2a2214; --bd2:#3a2f1a;
    --kb1:#1a1510; --kb2:#100c07; --on1:#533d14; --on2:#2e230c; --onc:#f2c46e; --onbd:#7a5f1f;
    --accent:#e0a53f; --panel1:#100d08; --panel2:#0a0805; --boxbg:#0e0b07;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #050607; color: var(--rm);
    font-family: 'Inter', system-ui, sans-serif; touch-action: none; user-select: none;
  }
  #scope { position: absolute; inset: 0; right: 280px; width: auto; height: 100%; display: block; }

  /* ---------- instrumentpanel (hoyre side) ---------- */
  .panel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 280px; z-index: 20;
    display: flex; flex-direction: column; gap: 7px; padding: 9px;
    background: linear-gradient(180deg, var(--panel1), var(--panel2));
    border-left: 1px solid var(--bd); overflow-y: auto; scrollbar-width: none;
  }
  .panel::-webkit-scrollbar { width: 0; }
  .box { border: 1px solid var(--bd); border-radius: 8px; background: var(--boxbg); padding: 7px 9px; flex: none; }
  .box h4 {
    margin: 0 0 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.22em;
    color: var(--rd); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;
  }
  .box h4 small { font-size: 8px; letter-spacing: 0.14em; color: var(--rd); font-weight: 700; }

  .brandrow { display: flex; align-items: center; gap: 8px; padding: 2px 2px 0; flex: none; }
  .brandrow img { height: 20px; background: #fff; border-radius: 5px; padding: 2px 5px; }
  .brandrow b { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: var(--rt); }
  .brandrow span { font-size: 8.5px; color: var(--rd); letter-spacing: 0.12em; }

  .rangebig { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .rangebig b { font-size: 27px; color: var(--rt); font-variant-numeric: tabular-nums; line-height: 1; }
  .rangebig small { font-size: 9px; color: var(--rd); font-weight: 700; text-align: right; line-height: 1.5; }

  button.key {
    min-height: 42px; border: 1px solid var(--bd2); border-radius: 8px;
    background: linear-gradient(180deg, var(--kb1), var(--kb2)); color: var(--rm);
    font: 700 10.5px/1.15 'Inter', system-ui, sans-serif; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; padding: 4px 2px;
  }
  button.key:active { filter: brightness(1.25); transform: translateY(1px); }
  button.key.on { background: linear-gradient(180deg, var(--on1), var(--on2)); color: var(--onc); border-color: var(--onbd); }
  button.key.warnkey.on { background: linear-gradient(180deg, #6b1c17, #3d0f0c); color: #ffb4ad; border-color: #a03028; }
  button.key small { display: block; font-size: 8px; letter-spacing: 0.14em; color: var(--rd); margin-top: 2px; }
  button.key.on small { color: inherit; opacity: 0.75; }
  .keys2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .keys3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .mt { margin-top: 5px; }

  .slider { display: grid; grid-template-columns: 34px 1fr 26px; gap: 8px; align-items: center; margin-top: 3px; }
  .slider span { font-size: 9px; font-weight: 800; letter-spacing: 0.16em; color: var(--rd); text-transform: uppercase; }
  .slider output { font-size: 10px; font-weight: 700; color: var(--rm); text-align: right; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; min-height: 30px; accent-color: var(--accent); }
  .box.auto .slider input { pointer-events: none; opacity: 0.5; }

  .lim { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 5px; align-items: center; margin-top: 5px; }
  .lim span { font-size: 8.5px; font-weight: 800; letter-spacing: 0.12em; color: var(--rd); }
  .lim b { font-size: 12px; color: var(--rt); font-variant-numeric: tabular-nums; text-align: right; padding-right: 2px; }
  .lim button { min-width: 34px; min-height: 30px; border: 1px solid var(--bd2); border-radius: 7px;
    background: linear-gradient(180deg, var(--kb1), var(--kb2)); color: var(--rm); font: 800 13px/1 'Inter'; cursor: pointer; }
  .lim button:active { filter: brightness(1.3); }

  .tlist { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; max-height: 132px; overflow-y: auto; scrollbar-width: none; }
  .tlist::-webkit-scrollbar { width: 0; }
  .trow { border: 1px solid var(--bd); border-radius: 6px; padding: 4px 7px; font-size: 9.5px; line-height: 1.45;
    color: var(--rm); font-variant-numeric: tabular-nums; }
  .trow b { color: var(--rt); font-size: 10px; letter-spacing: 0.06em; }
  .trow.danger { border-color: #a03028; color: #ffb4ad; background: rgba(160, 40, 30, 0.12); }
  .trow.danger b { color: var(--danger); }
  .trow .sub { color: var(--rd); }
  .trow.danger .sub { color: #d98a83; }

  .alist { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
  .arow { border-radius: 6px; padding: 4px 7px; font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    color: var(--rd); border: 1px solid var(--bd); }
  .arow.warn { color: var(--warn); border-color: #4b3a12; background: rgba(75, 58, 18, 0.16); }
  .arow.danger { color: var(--danger); border-color: #a03028; background: rgba(160, 40, 30, 0.14); }
  .arow.unack { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  .navbtn {
    display: grid; place-items: center; min-height: 44px; border-radius: 8px;
    border: 1px solid var(--bd2); background: linear-gradient(180deg, var(--kb1), var(--kb2)); color: var(--rm);
    font: 700 11px/1 'Inter', system-ui, sans-serif; letter-spacing: 0.12em;
    text-transform: uppercase; text-decoration: none;
  }
  .navbtn:active { filter: brightness(1.25); }

  .demo {
    padding: 7px 10px; border: 1px solid #4b3a12; border-radius: 8px; flex: none;
    background: rgba(23, 18, 6, 0.6); color: var(--warn); font-size: 8.5px; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase; text-align: center;
  }
  .spacer { margin-top: auto; }

  @media (max-width: 1080px) {
    .panel { width: 236px; }
    #scope { right: 236px; }
  }
  /* Telefon: kontrollpanelet legges som et rullbart bunnark over full bredde,
     og skopet faar hele bredden over. resize() nullstiller scope-kantene. */
  html.mob .panel {
    left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 44vh;
    border-left: none; border-top: 1px solid var(--bd);
  }
  html.mob #scope { right: 0; }
</style>
<script src="/kiosk-lock.js"></script>
<script src="/fullscreen.js" defer></script>
</head>
<body>
<canvas id="scope"></canvas>

<aside class="panel">
  <div class="brandrow">
    <img src="uploads/HT_Main_Logo_Black_Web.svg" alt="" />
    <div><b>HT RADAR</b><br /><span>X-BAND · 25 kW · SIMULATOR</span></div>
  </div>

  <div class="box">
    <h4>Transceiver</h4>
    <div class="keys3">
      <button class="key on" id="txBtn" type="button">TX<small id="txSub">Transmit</small></button>
      <button class="key" id="plsBtn" type="button">MP<small>Pulse</small></button>
      <button class="key" id="palBtn" type="button">GRN<small>Phosphor</small></button>
    </div>
  </div>

  <div class="box">
    <h4>Range <small id="ringVal">RINGS 1.5 NM</small></h4>

      <b id="rngVal">6</b>
      <small>NM<br />X-BAND</small>
    </div>
    <div class="keys2 mt">

    <div class="keys3 mt">

      <button class="key on" id="trailsBtn" type="button">Trails<small id="trailsSub">3 min</small></button>
      <button class="key" id="vectBtn" type="button">Vect REL<small id="vectSub">6 min</small></button>

  <div class="box">

    <div class="keys3">
      <button class="key on" id="modeCurs" type="button">Curs</button>
      <button class="key" id="modeEbl" type="button">EBL<br>VRM</button>

      <button class="key" id="clrEbl" type="button">Clear EBL</button>
      <button class="key" id="clrTT" type="button">Clear TT</button>

  <div class="box">
    <h4>Tracked targets <small id="ttCount">TT 0 · AIS ON</small></h4>
    <div class="keys3">
      <button class="key on" id="aisBtn" type="button">AIS</button>
      <button class="key" id="gzBtn" type="button">Guard<br>Zone</button>
      <button class="key warnkey" id="ackBtn" type="button">ACK<br>Alarm</button>
    </div>
    <div class="lim">
      <span>CPA LIM</span><b id="cpaVal">0.5 NM</b>
      <button id="cpaDn" type="button">−</button><button id="cpaUp" type="button">+</button><span></span>
    </div>
    <div class="lim" style="margin-top:3px">
      <span>TCPA LIM</span><b id="tcpaVal">6 MIN</b>
      <button id="tcpaDn" type="button">−</button><button id="tcpaUp" type="button">+</button><span></span>
    </div>
    <div class="tlist" id="ttList"></div>
  </div>

  <div class="box" id="tuneBox">
    <h4>Tuning <small id="tuneStat">AUTOTUNE OK</small></h4>
    <div class="slider"><span>Gain</span><input id="gain" type="range" min="20" max="100" value="72" /><output id="gainOut">72</output></div>
    <div class="slider"><span>Sea</span><input id="sea" type="range" min="0" max="100" value="30" /><output id="seaOut">30</output></div>
    <div class="slider"><span>Rain</span><input id="rain" type="range" min="0" max="100" value="10" /><output id="rainOut">10</output></div>
    <div class="keys3 mt">
      <button class="key" id="autoBtn" type="button">Auto</button>
      <button class="key on" id="irBtn" type="button">IR</button>

  <div class="box">

  <div class="keys2 spacer" style="flex:none">
    <a class="navbtn" href="ht-ecdis.html" onclick="this.href='ht-ecdis.html'+location.search;" onpointerup="if(!event.isPrimary){event.preventDefault();window.location.href='ht-ecdis.html'+location.search;}">ECDIS</a>
    <a class="navbtn" href="/select.html" onpointerup="if(!event.isPrimary){event.preventDefault();window.location.href=this.href;}">Main kiosk</a>
  </div>

  <div class="demo">Radar demo — not for navigation · build 0821-3</div>
</aside>

<script>
(function () {
  "use strict";

  // ================= Seilas-sim: samme rute og tilstand som ECDIS =================
  // ECDIS lagrer mrd_ship/mrd_route (localStorage + server) hvert 5. sekund og
  // dodregner etter veggklokken. Radaren leser samme tilstand og gjor samme
  // dodregning, saa begge skjermene viser samme seilas - uten dobbel skriving.
  // Er ECDIS aapen samtidig, overtar dens direktesendte tilstand (BroadcastChannel).

  var DEFAULT_ROUTE = [
    { lat: 59.985, lon: 4.66 }, { lat: 60.04, lon: 4.78 }, { lat: 60.075, lon: 4.90 },
    { lat: 60.115, lon: 5.00 }, { lat: 60.165, lon: 5.08 }, { lat: 60.225, lon: 5.17 },
    { lat: 60.30, lon: 5.235 }, { lat: 60.345, lon: 5.27 }
  ];
  var CRUISE = 14.5;

  function distNm(a, b) {
    var dLat = (b.lat - a.lat) * 60;
    var dLon = (b.lon - a.lon) * 60 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    return Math.hypot(dLat, dLon);
  }
  function bearingDeg(a, b) {
    var dLat = (b.lat - a.lat), dLon = (b.lon - a.lon) * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    return (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;
  }
  function moveLL(lat, lon, brgDeg, nm) {
    var b = brgDeg * Math.PI / 180;
    return {
      lat: lat + Math.cos(b) * nm / 60,
      lon: lon + Math.sin(b) * nm / 60 / Math.cos(lat * Math.PI / 180)
    };
  }
  function loadJson(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }

  var route = DEFAULT_ROUTE;
  function adoptRoute(r) {
    if (r && r.route && r.route.length > 1) route = r.route;
  }
  adoptRoute(loadJson("mrd_route"));

  var own = { lat: route[0].lat, lon: route[0].lon, hdg: bearingDeg(route[0], route[1]), cog: 0, sog: CRUISE, leg: 1 };
  own.cog = own.hdg;
  var cruiseSog = CRUISE;               // farten solo-dodregningen soker mot
  var soloSail = true;                  // gikk ECDIS langs rute sist vi hoerte fra den?
  var everSynced = false;               // har vi noen gang sett ECDIS-tilstand?

  // ANKERET er ECDIS' egen skipstilstand - ikke radarens gjetning. Det holder
  // posisjonen ECDIS sist meldte, fort frem til NAA. Alt radaren tegner maales
  // mot `own`, som glir mykt inn paa ankeret; da hopper ikke hele bildet
  // (land, ekko, AIS) hver gang et nytt snapshot lander.
  var anchor = null;                    // {lat,lon,hdg,cog,sog,sim,leg,legKnown,at,srcAt}
  var snapSeen = {};                    // siste savedAt per kilde - mot dobbeltadopsjon
  var FOLLOW_MS = 20000;                // hvor lenge et anker foelges for radaren seiler selv
  function syncAgeMs() { return anchor ? Date.now() - anchor.srcAt : Infinity; }
  function following() { return syncAgeMs() < FOLLOW_MS; }

  // Samme regnestykke som ECDIS' deadReckonAlongRoute - inkludert dens
  // fartsklamring - slik at et gammelt snapshot lander paa NOYAKTIG samme
  // punkt paa begge skjermene naar de gjenopptar seilasen hver for seg.
  function drAlongRoute(s, seconds) {
    if (route.length < 2) return;
    var legLen = [], total = 0, i;
    for (i = 1; i < route.length; i++) { var d = distNm(route[i - 1], route[i]); legLen.push(d); total += d; }
    if (total < 0.1) return;
    var sogDr = Math.max(6, Math.min(16, s.sog || CRUISE));
    var pos = 0;
    for (i = 1; i < s.leg; i++) pos += legLen[i - 1];
    var legD = legLen[s.leg - 1] || 0.0001;
    pos += Math.max(0, Math.min(legD, legD - distNm(s, route[s.leg])));
    var dist = (pos + sogDr * seconds / 3600) % total;
    var acc = 0, li = 1;
    for (; li < route.length - 1; li++) { if (acc + legLen[li - 1] >= dist) break; acc += legLen[li - 1]; }
    var fa = route[li - 1], fb = route[li];
    var f = Math.max(0, Math.min(1, (dist - acc) / (legLen[li - 1] || 1)));
    s.lat = fa.lat + (fb.lat - fa.lat) * f;
    s.lon = fa.lon + (fb.lon - fa.lon) * f;
    s.hdg = s.cog = bearingDeg(fa, fb);
    s.sog = sogDr; s.leg = li; s.legKnown = true;
  }

  // Adopterer et skips-snapshot fra ECDIS og forer det frem til NAA.
  // `ageMs` er hvor gammelt snapshotet er MAALT UAVHENGIG av radarens egen
  // klokke: serveren stempler bade lagringen og svaret, saa to maskiner med
  // ulik klokke likevel lander paa samme posisjon. Uten dette laa radaren
  // permanent 5-10 sekunder bak kartet og rykket bakover ved hver synk.
  // Korte hull dodregnes langs meldt COG (det er samme bevegelse ECDIS selv
  // gjor over noen sekunder); lange hull dodregnes langs ruten.
  function adoptShip(snap, ageMs, src) {
    if (!snap || !snap.ship || !snap.savedAt) return false;
    if (snap.ship.lat == null || snap.ship.lon == null) return false;
    if (!isFinite(snap.ship.lat) || !isFinite(snap.ship.lon)) return false;
    src = src || "local";
    if (snap.savedAt <= (snapSeen[src] || 0)) return false;   // samme snapshot igjen
    snapSeen[src] = snap.savedAt;
    var age = isFinite(ageMs) ? ageMs : (Date.now() - snap.savedAt);
    if (!(age >= 0) || age > 12 * 3600e3) age = 0;            // vill klokkeforskjell: bruk posisjonen som den er
    var takenAt = Date.now() - age;
    if (anchor && takenAt <= anchor.srcAt + 250) return false; // vi foelger allerede noe ferskere

    var hdg = snap.ship.hdg != null ? snap.ship.hdg : own.hdg;
    var s = {
      lat: snap.ship.lat, lon: snap.ship.lon,
      hdg: hdg, cog: snap.ship.cog != null ? snap.ship.cog : hdg,
      sog: Math.max(0, snap.ship.sog || 0),
      // ECDIS kan kjore simuleringen 8x eller 30x. Uten denne faktoren
      // krypet radaren mens kartet fos avgaarde, og synken ble et hopp.
      sim: Math.max(1, Math.min(60, snap.simSpeed || 1)),
      leg: Math.max(1, Math.min(snap.activeLeg || 1, Math.max(1, route.length - 1))),
      legKnown: !!snap.activeLeg,
      at: Date.now(), srcAt: takenAt
    };
    soloSail = !!snap.sailing;
    cruiseSog = snap.sailing ? Math.max(4, Math.min(20, s.sog || CRUISE)) : s.sog;
    var seconds = age / 1000;
    if (snap.sailing && route.length > 1 && seconds > 20) drAlongRoute(s, seconds);
    else if (s.sog > 0.05 && seconds > 0) {
      var st = moveLL(s.lat, s.lon, s.cog, s.sog * s.sim * seconds / 3600);
      s.lat = st.lat; s.lon = st.lon;
    }
    anchor = s;
    own.leg = s.leg;
    if (!everSynced) {
      everSynced = true;
      own.lat = s.lat; own.lon = s.lon; own.hdg = s.hdg; own.cog = s.cog; own.sog = s.sog;
    }
    return true;
  }
  adoptShip(loadJson("mrd_ship"), null, "local");

  var live = null, liveAt = 0, liveTargets = null, liveTargetsAt = 0;
  try {
    var chan = new BroadcastChannel("meridian-helm");
    chan.onmessage = function (e) {
      var m = e.data;
      if (!m || m.type !== "state" || !m.ship || m.ship.lat == null) return;
      live = m.ship; liveAt = Date.now();
      // ECDIS' maalliste er ogsaa EKTE AIS (den har ingen simulert flaate),
      // og brukes bare naar radarens egen henting er torr - typisk naar ECDIS
      // kjorer paa aisstream.io, der gratisnokkelen tillater EN tilkobling og
      // radaren derfor ikke kan koble seg opp selv. Disse posisjonene er
      // NOYAKTIG dem kartet tegner, og roeres derfor aldri av radaren.
      if (m.targets && m.targets.length) { liveTargets = m.targets; liveTargetsAt = Date.now(); }
    };
  } catch (e) {}

  // Server-synk: radaren viser samme seilas som ECDIS ogsaa naar ECDIS kjorer
  // paa en annen skjerm/maskin eller nettopp ble lukket - /api/ecdis-state
  // polles hvert 5. sekund. Svaret baerer serverens egne tidsstempler, saa
  // snapshotets alder maales i EN klokke og radaren kan fore det frem til naa
  // i stedet for aa tegne en gammel posisjon. storage-hendelser gir umiddelbar
  // synk fra ECDIS i samme nettleserprofil; er ECDIS aapen i samme nettleser
  // overtar BroadcastChannel. AIS-maalene er ikke med her - de hentes fra
  // stroemmen direkte.
  // Samme nokkel som ECDIS, regnet ut ETT sted (kiosk.js) slik at de to
  // skjermene ikke kan drifte fra hverandre naar de aapnes ulikt.
  var STATE_URL = window.htEcdisStateUrl ? window.htEcdisStateUrl() : "/api/ecdis-state";

  function pollServer() {
    if (document.hidden) return;
    var t0 = Date.now();
    fetch(STATE_URL, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (st) {
      if (!st) return;
      if (st.route) adoptRoute(st.route);
      if (!st.ship) return;
      if (live && Date.now() - liveAt < 4000) return;
      var age = (st.serverNow && st.serverSavedAt)
        ? (st.serverNow - st.serverSavedAt) + (Date.now() - t0)   // ren serverklokke + tiden svaret brukte hit
        : (Date.now() - (st.ship.savedAt || Date.now()));
      adoptShip(st.ship, age, "server");
    }).catch(function () {});
  }
  pollServer();
  setInterval(pollServer, 5000);
  window.addEventListener("storage", function (e) {
    if (!e || !e.key) return;
    if (e.key === "mrd_ship") adoptShip(loadJson("mrd_ship"), null, "local");

  function kPx() { return R / state.range; }

  function geoToScope(lat, lon) {

  }

  // Origo (egen posisjon paa skjermen): senter + TM-drift + off-center-forskyvning.
  function computeOrigin(depth) {

      var n = (own.lat - tmA.lat) * 60, e = (own.lon - tmA.lon) * 60 * Math.cos(own.lat * Math.PI / 180);

  // ================= CPA/TCPA og maalvurdering =================
  function evalTarget(t) {
    var cosLat = Math.cos(own.lat * Math.PI / 180);
    var e = (t.lon - own.lon) * 60 * cosLat, n = (t.lat - own.lat) * 60;
    var rng = Math.hypot(e, n);
    var brg = (Math.atan2(e, n) * 180 / Math.PI + 360) % 360;
    var oc = own.cog * Math.PI / 180, tc = (t.cog || 0) * Math.PI / 180;
    var rvx = (t.sog || 0) * Math.sin(tc) - own.sog * Math.sin(oc);
    var rvy = (t.sog || 0) * Math.cos(tc) - own.sog * Math.cos(oc);
    var vv = rvx * rvx + rvy * rvy;
    var tcpa = vv < 1e-4 ? Infinity : -(e * rvx + n * rvy) / vv;
    var cpa = tcpa > 0 && isFinite(tcpa) ? Math.hypot(e + rvx * tcpa, n + rvy * tcpa) : rng;
    var danger = cpa < state.cpaLim && tcpa > 0 && tcpa * 60 < state.tcpaLim;
    return { rng: rng, brg: brg, cpa: cpa, tcpaMin: isFinite(tcpa) ? tcpa * 60 : null, danger: danger, rvx: rvx, rvy: rvy };
  }

  function ttFor(name) {
    for (var i = 0; i < tts.length; i++) if (tts[i].key === name && !tts[i].lost) return tts[i];

  function acquireAt(brg, rng) {

    for (var i = 0; i < list.length; i++) {

    }
    if (!best) { addAlarm("NO TARGET AT CURSOR", "info"); return; }
    if (ttFor(best.name)) { addAlarm("ALREADY TRACKED — " + best.name, "info"); return; }
    if (tts.filter(function (x) { return !x.lost; }).length >= 10) { addAlarm("TT CAPACITY (10) REACHED", "warn"); return; }
    ttSeq += 1;

  // Vurderer alle maal: fare (CPA/TCPA), guard zone og tapte TT — kjorer paa intervall.
  function assess() {
    var list = targets(), i, t, info;
    var present = {};
    dangerMap = {}; cpaMap = {};
    for (i = 0; i < list.length; i++) {
      t = list[i]; if (t.lat == null || !t.name) continue;
      present[t.name] = true;
      info = evalTarget(t);
      cpaMap[t.name] = info;
      if (info.rng > state.range * 2.2) continue;
      dangerMap[t.name] = info.danger;
      var watched = ttFor(t.name) || (state.ais && info.rng < state.range * 1.2);
      if (info.danger && watched) {
        if (!alarmedCpa[t.name]) { alarmedCpa[t.name] = true; addAlarm("CPA/TCPA ALARM — " + t.name, "danger"); }
      } else if (alarmedCpa[t.name] && !info.danger) delete alarmedCpa[t.name];

  // ================= Land prerendres relativt egen posisjon =================
  // Landmasken tegnes i skopets egne koordinater: x er lineaer i lengdegrad
  // og y lineaer i breddegrad, saa en Mercator-flis daekker et rektangel og
  // kan legges inn med en enkel drawImage. Innenfor EN flis er Mercator-
  // strekket under en piksel paa disse breddene, saa forenklingen koster
  // ingenting - og landet havner der kartet har det.
  function chartTiles(ref, k) {
    var nmHalf = (LS / 2) / k;
    var cosLat = Math.max(0.2, Math.cos(ref.lat * Math.PI / 180));
    var dLat = nmHalf / 60, dLon = dLat / cosLat;
    var latMin = Math.max(-85, ref.lat - dLat), latMax = Math.min(85, ref.lat + dLat);
    var lonMin = ref.lon - dLon, lonMax = ref.lon + dLon;
    var z = landZoom(k, ref.lat), list = tilesFor(z, latMin, latMax, lonMin, lonMax);
    while (list.length > 48 && z > 5) { z -= 1; list = tilesFor(z, latMin, latMax, lonMin, lonMax); }
    return list;
  }
  // Ber om flisene og sier hvor mange som allerede er dekodet. Kallet er det
  // som starter nedlastingen, saa det gjores ogsaa naar vi bare sjekker.
  function chartTilesReady(list) {
    var ready = 0;
    for (var i = 0; i < list.length; i++) if (landTile(list[i].z, list[i].x, list[i].y)) ready += 1;
    return ready;
  }
  function drawChartLand(ref, k, list) {
    var half = LS / 2;
    var cosLat = Math.max(0.2, Math.cos(ref.lat * Math.PI / 180));
    if (!list.length) return false;
    var any = false;
    landCx.save();
    landCx.translate(half, half);
    landCx.imageSmoothingEnabled = true;
    // Litt uskarphet: en flismaske har knivskarpe kanter, et fosforskop har
    // ikke det. Samme mykhet som polygonkonturen hadde for.
    landCx.filter = "blur(0.9px)";
    for (var i = 0; i < list.length; i++) {
      var t = list[i], cv = landTile(t.z, t.x, t.y);
      if (!cv) continue;
      var x0 = (t.lonMin - ref.lon) * 60 * cosLat * k;
      var x1 = (t.lonMax - ref.lon) * 60 * cosLat * k;
      var y0 = -(t.latMax - ref.lat) * 60 * k;
      var y1 = -(t.latMin - ref.lat) * 60 * k;
      if (x1 - x0 <= 0 || y1 - y0 <= 0) continue;
      landCx.drawImage(cv, x0, y0, x1 - x0, y1 - y0);
      any = true;
    }
    landCx.filter = "none";
    landCx.restore();
    if (!any) return false;
    // Masken er hvit; farg den i skopets fosforfarge.
    landCx.save();
    landCx.globalCompositeOperation = "source-in";
    landCx.fillStyle = PALC[state.pal].land;
    landCx.fillRect(0, 0, LS, LS);
    landCx.restore();
    return true;
  }

  // Reserve naar sjokartflisene ikke naas (offline kiosk): grov verdenskontur.
  function drawCoastLand(ref, k) {
    if (!coast) return false;
    landCx.save();
    landCx.translate(LS / 2, LS / 2);
    landCx.fillStyle = PALC[state.pal].land;
    landCx.filter = "blur(1.1px)";
    landCx.beginPath();
    var cosLat = Math.cos(ref.lat * Math.PI / 180);
    for (var pi = 0; pi < coast.length; pi++) {
      var poly = coast[pi];
      for (var ri = 0; ri < poly.length; ri++) {
        var ring = poly[ri], started = false;
        for (var vi = 0; vi < ring.length; vi++) {
          var n = (ring[vi][1] - ref.lat) * 60, e = (ring[vi][0] - ref.lon) * 60 * cosLat;
          var x = e * k, y = -n * k;
          if (!started) { landCx.moveTo(x, y); started = true; } else landCx.lineTo(x, y);
        }
        if (started) landCx.closePath();
      }
    }
    landCx.fill("evenodd");
    landCx.filter = "none";
    landCx.restore();
    return true;
  }

  // Ru opp landflatene med "manglende retur"-hull, som paa et ekte skop.
  function roughenLand() {
    landCx.save();
    landCx.translate(LS / 2, LS / 2);
    landCx.globalCompositeOperation = "destination-out";
    for (var s = 0; s < 1100; s++) {
      var ang = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * RMAX;
      landCx.fillStyle = "rgba(0,0,0," + (0.25 + Math.random() * 0.5).toFixed(2) + ")";
      landCx.fillRect(Math.cos(ang) * rr, Math.sin(ang) * rr, 2 + Math.random() * 3, 1.6);
    }
    landCx.globalCompositeOperation = "source-over";
    landCx.restore();
  }

  var landRetryAt = 0;                  // naar vi kan prove aa tegne land paa nytt
  function renderLand() {
    var k = kPx();
    var ref = { lat: own.lat, lon: own.lon, range: state.range };
    var list = chartTiles(ref, k);
    var ready = chartTilesReady(list);
    // Ingen fliser inne ennaa, men sjokartet virker: behold forrige bilde og
    // prov igjen om et oyeblikk. Uten dette blinket skopet mellom sjokartets
    // kystlinje og grovkonturen hver gang rekkevidden ble endret.

    landCx.clearRect(0, 0, LS, LS);

  // ================= Sektorstempling (ekko males inn der sveipet passerer) =================
  function stampSector(a0, a1) {
    var P = PALC[state.pal];
    var rot = rotRad();
    var pulseK = state.pulse === "SP" ? 0.8 : state.pulse === "LP" ? 1.38 : 1;
    echo.save();
    echo.beginPath();
    echo.arc(CX, CY, R, 0, Math.PI * 2);
    echo.clip();
    echo.translate(ORG.x, ORG.y);
    echo.rotate(rot);
    echo.beginPath();
    echo.moveTo(0, 0);
    echo.arc(0, 0, RMAX, a0 - Math.PI / 2, a1 - Math.PI / 2);
    echo.closePath();
    echo.clip();

    echo.drawImage(landC, 0, 0, landC.width, landC.height, -LS / 2, -LS / 2, LS, LS);

    var list = targets();
    for (var i = 0; i < list.length; i++) {
      var t = list[i]; if (t.lat == null) continue;
      var p = geoToScope(t.lat, t.lon);
      var d = Math.hypot(p.x, p.y);
      if (d > RMAX) continue;
      var blob = Math.max(3, 6.4 - d / R * 2.6) * pulseK * sizeK(t);
      var rx = blob * 2.2 * (state.es ? 1.5 : 1);
      var g = echo.createRadialGradient(p.x, p.y, 0, p.x, p.y, blob * 2.1);
      g.addColorStop(0, P.echoA);
      g.addColorStop(0.55, P.echoB);
      g.addColorStop(1, P.echoZ);
      echo.fillStyle = g;
      echo.beginPath();
      echo.ellipse(p.x, p.y, rx, blob * 1.6, Math.atan2(p.y, p.x) + Math.PI / 2, 0, Math.PI * 2);
      echo.fill();
    }

    var span = Math.max(0.02, a1 - a0);
    var seaN = Math.floor(state.sea * 30 * span * 12 * pulseK);
    echo.fillStyle = P.clut;
    for (i = 0; i < seaN; i++) {
      var ang = a0 + Math.random() * span - Math.PI / 2;
      var rr = Math.pow(Math.random(), 2.3) * R * 0.55;
      echo.fillRect(Math.cos(ang) * rr, Math.sin(ang) * rr, 1.5, 1.2);
    }
    var rainN = Math.floor(state.rain * 22 * span * 12);
    var rxc = Math.cos(performance.now() / 60000) * R * 0.45, ryc = Math.sin(performance.now() / 80000) * R * 0.4;
    echo.fillStyle = P.rain;
    for (i = 0; i < rainN; i++) {
      var px = rxc + (Math.random() - 0.5) * R * 0.5, py = ryc + (Math.random() - 0.5) * R * 0.4;
      if (Math.hypot(px, py) < RMAX) echo.fillRect(px, py, 2, 2);
    }
    // mottakerstoy ved hoy gain
    if (state.gain > 0.78) {
      var nN = Math.floor(span * 260 * (state.gain - 0.78));
      echo.fillStyle = P.noise;
      for (i = 0; i < nN; i++) {
        var na = a0 + Math.random() * span - Math.PI / 2;
        var nr = Math.sqrt(Math.random()) * RMAX;
        echo.fillRect(Math.cos(na) * nr, Math.sin(na) * nr, 1.4, 1.1);
      }
    }
    // interferens-spoker fra "andre radarer" naar IR er av
    if (!state.ir && Math.random() < 0.3) {
      var ia = a0 + Math.random() * span - Math.PI / 2;
      echo.strokeStyle = "rgba(" + P.glow + ",0.35)";
      echo.lineWidth = 1.2;
      echo.setLineDash([3, 9]);
      echo.beginPath();
      echo.moveTo(0, 0);
      echo.lineTo(Math.cos(ia) * RMAX, Math.sin(ia) * RMAX);
      echo.stroke();
      echo.setLineDash([]);
    }
    echo.restore();
  }

  function echoClear() {
    echo.save(); echo.setTransform(1, 0, 0, 1, 0, 0);
    echo.clearRect(0, 0, echoC.width, echoC.height); echo.restore();
  }

  // ================= Ekkospor (true trails — geostabile punkter) =================
  function drawTrails() {
    if (!state.trails) return;
    var P = PALC[state.pal];
    var now = performance.now();
    if (state.tx && now - lastTrailAt > 2000) {
      lastTrailAt = now;
      var list = targets();
      for (var i = 0; i < list.length; i++) {
        if (list[i].lat == null) continue;
        trailDots.push({ lat: list[i].lat, lon: list[i].lon, born: now });
      }
      while (trailDots.length > 900) trailDots.shift();
    }
    var life = state.trails * 1000;
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.clip();
    ctx.translate(ORG.x, ORG.y);
    ctx.rotate(rotRad());
    for (var d = 0; d < trailDots.length; d++) {
      var age = (now - trailDots[d].born) / life;
      if (age > 1) continue;
      var p = geoToScope(trailDots[d].lat, trailDots[d].lon);
      if (Math.hypot(p.x, p.y) > RMAX) continue;
      ctx.fillStyle = "rgba(" + P.trail + "," + (0.42 * (1 - age)).toFixed(3) + ")";
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.restore();
  }

  // ================= Datablokker i hjornene =================
  function drawBlock(anchor, rows, width, yPos) {
    var P = PALC[state.pal];
    var pad = 9, hh = 0, i;
    for (i = 0; i < rows.length; i++) hh += rows[i].big ? 26 : 15;
    var h = hh + pad * 2 - 3;
    var x = anchor.indexOf("l") > -1 ? 10 : W - 10 - width;
    var y = yPos != null ? yPos : anchor.indexOf("t") > -1 ? 10 : H - 10 - h;
    ctx.fillStyle = P.blockBg;
    ctx.strokeStyle = P.blockBd;
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, width, h, 7); else ctx.rect(x, y, width, h);
    ctx.fill(); ctx.stroke();
    var cy = y + pad + 4;
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.big) {
        ctx.font = "800 20px Inter, sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillStyle = r.col || P.txt;
        ctx.fillText(r.v, x + 10, cy + 7);
        if (r.l) {
          ctx.font = "800 8px Inter, sans-serif";
          ctx.fillStyle = P.dim;
          ctx.textAlign = "right";
          ctx.fillText(r.l, x + width - 10, cy + 7);
        }
        cy += 26;
      } else if (r.bar != null) {
        ctx.font = "800 8px Inter, sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillStyle = P.dim;
        ctx.fillText(r.l, x + 10, cy + 4);
        var bx = x + 52, bw = width - 62, seg = 14, gap = 3;
        var nseg = Math.floor(bw / (seg + gap));
        for (var sgi = 0; sgi < nseg; sgi++) {
          ctx.fillStyle = sgi / nseg < r.bar ? "rgba(" + P.glow + ",0.85)" : "rgba(" + P.glow + ",0.14)";
          ctx.fillRect(bx + sgi * (seg + gap), cy, seg, 7);
        }
        cy += 15;
      } else {
        ctx.font = "800 8px Inter, sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillStyle = P.dim;
        ctx.fillText(r.l, x + 10, cy + 4);
        ctx.font = (r.small ? "700 9.5px " : "700 11px ") + "Inter, sans-serif";
        ctx.textAlign = "right";
        ctx.fillStyle = r.col || P.mid;
        ctx.fillText(r.v, x + width - 10, cy + 4);
        cy += 15;
      }
    }
    return h;
  }

  function fmtPos(lat, lon) {
    var latD = Math.abs(lat), lonD = Math.abs(lon);
    return Math.floor(latD) + "°" + ((latD % 1) * 60).toFixed(2) + "'" + (lat >= 0 ? "N" : "S") + " " +
      String(Math.floor(lonD)).padStart(3, "0") + "°" + ((lonD % 1) * 60).toFixed(2) + "'" + (lon >= 0 ? "E" : "W");
  }
  function fmt3(v) { return v.toFixed(1).padStart(5, "0") + "°"; }

  // ================= Hovedtegning =================
  function overlay() {
    var P = PALC[state.pal];
    var rot = rotRad();
    var now = performance.now();
    var blinkOn = now % 900 < 500;

    // skopbunn
    ctx.fillStyle = P.shell;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.clip();
    var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
    bg.addColorStop(0, P.bg0);
    bg.addColorStop(1, P.bg1);
    ctx.fillStyle = bg;
    ctx.fillRect(CX - R, CY - R, R * 2, R * 2);
    ctx.globalAlpha = Math.max(0.2, state.gain);
    ctx.drawImage(echoC, 0, 0, echoC.width, echoC.height, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.restore();

    drawTrails();

    // ringer, kurslinje, vektorer, symboler — alt i rotert ramme rundt egen posisjon
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.clip();
    ctx.translate(ORG.x, ORG.y);
    ctx.rotate(rot);

    if (state.rings) {
      ctx.strokeStyle = P.ring;
      ctx.lineWidth = 1;
      var maxR = Math.hypot(ORG.x - CX, ORG.y - CY) + R;
      for (var ri = 1; ri * R / 4 <= maxR; ri++) {
        ctx.beginPath(); ctx.arc(0, 0, R * ri / 4, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.strokeStyle = P.ring;
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 7);
    ctx.stroke();

    // guard zone-sektor (±45° rundt baugen, 0.5–0.7 av range)
    if (state.gz) {
      var g1 = (own.hdg - 45) * Math.PI / 180 - Math.PI / 2, g2 = (own.hdg + 45) * Math.PI / 180 - Math.PI / 2;
      ctx.strokeStyle = "rgba(251,191,36,0.75)";
      ctx.lineWidth = 1.3;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(0, 0, R * 0.5, g1, g2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, R * 0.7, g1, g2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(Math.cos(g1) * R * 0.5, Math.sin(g1) * R * 0.5); ctx.lineTo(Math.cos(g1) * R * 0.7, Math.sin(g1) * R * 0.7);
      ctx.moveTo(Math.cos(g2) * R * 0.5, Math.sin(g2) * R * 0.5); ctx.lineTo(Math.cos(g2) * R * 0.7, Math.sin(g2) * R * 0.7);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // kurslinje (heading line)
    var ha = own.hdg * Math.PI / 180 - Math.PI / 2;
    ctx.strokeStyle = P.hdl;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ha) * RMAX, Math.sin(ha) * RMAX); ctx.stroke();

    // egen vektor (true)
    if (state.vecMode === "T" && own.sog > 0.3) {
      var ovl = own.sog * (state.vecMin / 60) * kPx();
      var oa = own.cog * Math.PI / 180 - Math.PI / 2;
      ctx.strokeStyle = P.sweep;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(oa) * ovl, Math.sin(oa) * ovl); ctx.stroke();
      ctx.setLineDash([]);
    }

    // maalsymboler: AIS-trekanter, TT-sirkler, vektorer, navn
    var list = targets();
    ctx.font = "600 10px Inter";
    for (var i = 0; i < list.length; i++) {
      var t = list[i]; if (t.lat == null) continue;
      var p = geoToScope(t.lat, t.lon);
      var sp = toScreen(p);
      if (Math.hypot(sp.x - CX, sp.y - CY) > R + 14) continue;
      var tt = t.name ? ttFor(t.name) : null;
      var danger = t.name && dangerMap[t.name];
      if (!state.ais && !tt) continue;

      // vektor (REL eller TRUE)
      var vjson = cpaMap[t.name];
      var vv, va;
      if (state.vecMode === "R" && vjson) { vv = Math.hypot(vjson.rvx, vjson.rvy); va = Math.atan2(vjson.rvx, vjson.rvy); }
      else { vv = t.sog || 0; va = (t.cog || 0) * Math.PI / 180; }
      var vl = vv * (state.vecMin / 60) * kPx();
      var col = danger ? DANGER : tt ? P.tt : P.ais;
      ctx.strokeStyle = col;
      ctx.lineWidth = danger ? 1.6 : 1.1;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.sin(va) * vl, p.y - Math.cos(va) * vl);
      ctx.stroke();

      var sk = 0.8 + sizeK(t) * 0.35;
      if (danger && blinkOn) {
        // faremaal: fylt roed blinkende trekant
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((t.cog || 0) * Math.PI / 180);
        ctx.fillStyle = DANGER;
        ctx.beginPath(); ctx.moveTo(0, -9 * sk); ctx.lineTo(6.5 * sk, 7 * sk); ctx.lineTo(-6.5 * sk, 7 * sk); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (tt) {
        // sporet maal (TT): sirkel — stiplet mens den etableres
        ctx.strokeStyle = danger ? DANGER : P.tt;
        ctx.lineWidth = 1.4;
        if (performance.now() - tt.acqAt < 3000) ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(p.x, p.y, 7.5, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (state.ais && !danger) {
        // AIS: trekant orientert etter kurs
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((t.cog || 0) * Math.PI / 180);
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(0, -6.5 * sk); ctx.lineTo(4.5 * sk, 5.5 * sk); ctx.lineTo(-4.5 * sk, 5.5 * sk); ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
      var label = (tt ? tt.id + " " : "") + (t.name || "");
      if (label) {
        ctx.save();
        ctx.translate(p.x + 10, p.y - 10);
        ctx.rotate(-rot);
        ctx.fillStyle = danger ? DANGER : tt ? P.tt : P.aisTx;
        ctx.textAlign = "left";
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }
    }

    // eget skip
    ctx.fillStyle = P.hdl;
    ctx.beginPath(); ctx.arc(0, 0, 2.8, 0, Math.PI * 2); ctx.fill();

    // EBL / VRM
    if (state.ebl) {
      var ea = state.ebl.brg * Math.PI / 180 - Math.PI / 2;
      ctx.setLineDash([7, 7]);
      ctx.strokeStyle = "rgba(251, 191, 36, 0.85)";
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ea) * RMAX, Math.sin(ea) * RMAX); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, state.ebl.rng * kPx(), 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // markeringskryss for cursor
    if (state.cursor) {
      var ca2 = state.cursor.brg * Math.PI / 180 - Math.PI / 2;
      var cr = state.cursor.rng * kPx();
      var cx2 = Math.cos(ca2) * cr, cy2 = Math.sin(ca2) * cr;
      ctx.strokeStyle = P.sweep;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(cx2 - 7, cy2); ctx.lineTo(cx2 - 2.5, cy2); ctx.moveTo(cx2 + 2.5, cy2); ctx.lineTo(cx2 + 7, cy2);
      ctx.moveTo(cx2, cy2 - 7); ctx.lineTo(cx2, cy2 - 2.5); ctx.moveTo(cx2, cy2 + 2.5); ctx.lineTo(cx2, cy2 + 7);
      ctx.stroke();
    }

    ctx.restore();

    // sveip med kontinuerlig etterglod (konisk gradient bak streken)
    if (state.tx) {
      ctx.save();
      ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.clip();
      ctx.translate(ORG.x, ORG.y);
      ctx.rotate(rot);
      var sa = sweep - Math.PI / 2;
      if (ctx.createConicGradient) {
        var cg = ctx.createConicGradient(sa, 0, 0);
        cg.addColorStop(0, "rgba(" + P.glow + ", 0.30)");
        cg.addColorStop(0.006, "rgba(" + P.glow + ", 0.02)");
        cg.addColorStop(0.05, "rgba(" + P.glow + ", 0)");
        cg.addColorStop(0.80, "rgba(" + P.glow + ", 0)");
        cg.addColorStop(1, "rgba(" + P.glow + ", 0.30)");
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(0, 0, RMAX, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = P.sweep;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(sa) * RMAX, Math.sin(sa) * RMAX); ctx.stroke();
      ctx.restore();
    }

    // maske utenfor skopet: eksplisitt moveTo + eksakt 2*PI, ellers legger
    // Canvas en korde over skopet (den "svarte kilen").
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.moveTo(CX + R + 1, CY);
    ctx.arc(CX, CY, R + 1, 0, Math.PI * 2, true);
    ctx.fillStyle = P.shell;
    ctx.fill("evenodd");
    ctx.restore();

    // peilering utenfor skopkanten
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(rot);
    ctx.strokeStyle = P.ringLn;
    ctx.fillStyle = P.ringTx;
    ctx.lineWidth = 1;
    ctx.font = "600 10px Inter";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.beginPath(); ctx.arc(0, 0, R + 2, 0, Math.PI * 2); ctx.stroke();
    for (var b = 0; b < 360; b += 5) {
      var a = b * Math.PI / 180 - Math.PI / 2;
      var len = b % 30 === 0 ? 9 : b % 10 === 0 ? 6 : 3.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (R + 2), Math.sin(a) * (R + 2));
      ctx.lineTo(Math.cos(a) * (R + 2 + len), Math.sin(a) * (R + 2 + len));
      ctx.stroke();
      if (b % 30 === 0) {
        ctx.save();
        ctx.translate(Math.cos(a) * (R + 24), Math.sin(a) * (R + 24));
        ctx.rotate(-rot);
        ctx.fillText(String(b).padStart(3, "0"), 0, 0);
        ctx.restore();
      }
    }
    // kursmarkoer paa ringen
    var hma = own.hdg * Math.PI / 180 - Math.PI / 2;
    ctx.fillStyle = P.sweep;
    ctx.save();
    ctx.translate(Math.cos(hma) * (R + 2), Math.sin(hma) * (R + 2));
    ctx.rotate(hma + Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(-4.5, -10); ctx.lineTo(4.5, -10); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.restore();

    // nordmerke (gul trekant paa skjermnord for gjeldende orientering)
    ctx.save();
    ctx.translate(CX, CY);
    var na = rot - Math.PI / 2;
    ctx.fillStyle = WARN;
    ctx.translate(Math.cos(na) * (R + 2), Math.sin(na) * (R + 2));
    ctx.rotate(na + Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(-5, -12); ctx.lineTo(5, -12); ctx.closePath(); ctx.fill();
    ctx.restore();

    // ---------- datablokker ----------
    // Paa smale skop (telefon) vises bare de to viktigste blokkene, smalere.
    var slim = W < 560;
    var orientTxt = state.orient === "N" ? "N-UP" : state.orient === "H" ? "H-UP" : "C-UP";
    var leftY = 10 + drawBlock("tl", [
      { big: true, v: (state.range < 1 ? state.range.toFixed(2) : String(state.range)) + " NM", l: "RANGE" },
      { l: "RINGS", v: state.rings ? (state.range / 4).toFixed(state.range < 3 ? 2 : 1) + " NM" : "OFF" },
      { l: "PULSE", v: state.pulse + " · IR " + (state.ir ? "ON" : "OFF") + " · ES " + (state.es ? "ON" : "OFF"), small: true },
      { l: "MODE", v: orientTxt + " · " + state.motion + (state.offcenter ? " · OC" : "") }
    ], slim ? 150 : 196) + 8;

    // Venstre live-datakolonne: rute/veipunkt, egne sensorer og miljodata.
    // Tegnes bare naar gutteren utenfor PPI-sirkelen har plass til den
    // (kioskens 16:9 har det; smale vinduer beholder bare hjorneblokkene).
    if (CX - R >= 220) {
      var nowMs = Date.now();
      var nv = navData();
      var env = envNow();
      if (nv) {
        var xteAbs = Math.abs(nv.xte);
        leftY += drawBlock("tl", [
          { big: true, v: nv.dst.toFixed(2) + " NM", l: "WPT " + (nv.leg + 1) + "/" + nv.n },
          { l: "BRG WPT", v: fmt3(nv.brg) },
          { l: "XTE", v: xteAbs.toFixed(2) + " NM" + (xteAbs < 0.01 ? "" : nv.xte > 0 ? " STBD" : " PORT"), col: xteAbs > 0.2 ? WARN : null },
          { l: "ETA WPT", v: nv.ttgH != null ? fmtUTC(nowMs + nv.ttgH * 3600e3) + " UTC" : "—" },
          { l: "TTG", v: fmtDur(nv.ttgH) }
        ], 196, leftY) + 8;
      }
      var stw = Math.max(0, own.sog - env.drift * Math.cos((env.set - own.cog) * Math.PI / 180));
      var rotAbs = Math.abs(rotDegMin);
      leftY += drawBlock("tl", [
        { l: "STW", v: stw.toFixed(1) + " KN" },
        { l: "ROT", v: rotAbs < 0.05 ? "0.0°/MIN" : rotAbs.toFixed(1) + "°/MIN " + (rotDegMin > 0 ? "STBD" : "PORT") },
        { l: "LOG", v: (logNm < 100 ? logNm.toFixed(2) : logNm.toFixed(1)) + " NM" }
      ], 196, leftY) + 8;
      leftY += drawBlock("tl", [
        { l: "WIND T", v: fmt3(env.windDir) + " · " + env.windKn.toFixed(0) + " KN" },
        { l: "SET·DRIFT", v: fmt3(env.set) + " · " + env.drift.toFixed(1) + " KN" },
        { l: "DEPTH", v: env.depth.toFixed(0) + " M" },
        { l: "UTC", v: fmtUTC(nowMs, true) }
      ], 196, leftY) + 8;
    }

    var trRows = [
      { big: true, v: fmt3(own.hdg), l: "GYRO" },
      { l: "SOG", v: own.sog.toFixed(1) + " KN" },
      { l: "COG", v: fmt3(own.cog) }
    ];
    if (!slim) trRows.push({ l: "POS", v: fmtPos(own.lat, own.lon), small: true });
    // SRC sier hvor posisjonen kommer fra, og hvor gammel synken er — staar
    // det "DR · SOLO" seiler radaren for seg selv og skal ikke ventes aa
    // ligge paa kartets skip.
    var syncS = Math.round(syncAgeMs() / 1000);
    trRows.push({ l: "SRC", v: (live && Date.now() - liveAt < 4000) ? "ECDIS LIVE"
      : (following() ? "ECDIS SYNC " + (syncS < 1 ? "0" : syncS) + "S" : "DR · SOLO") });
    trRows.push({ l: "AIS", v: aisLive() ? (aisTargets.length ? "LIVE · " + aisTargets.length + " TGT" : "ECDIS · " + liveTargets.length + " TGT") : (aisState === "error" ? "NO FEED" : "WAIT") });
    drawBlock("tr", trRows, slim ? 160 : 212);

    var cur = state.cursor;
    var curPos = cur ? moveLL(own.lat, own.lon, cur.brg, cur.rng) : null;
    if (!slim) drawBlock("bl", [
      { l: "CURS", v: cur ? fmt3(cur.brg) + " · " + cur.rng.toFixed(2) + " NM" : "—" },
      { l: "", v: curPos ? fmtPos(curPos.lat, curPos.lon) : "", small: true },
      { l: "TUNE", bar: 0.82 + Math.sin(performance.now() / 700 + tuneT) * 0.06 },
      { l: "TX", v: state.tx ? "X-BAND 25 KW · 24 RPM" : "STAND-BY", col: state.tx ? null : WARN, small: true }
    ], 208);

    var dangerAny = false;
    for (var dk in dangerMap) if (dangerMap[dk]) { dangerAny = true; break; }
    if (!slim) drawBlock("br", [
      { l: "EBL 1", v: state.ebl ? fmt3(state.ebl.brg) : "OFF" },
      { l: "VRM 1", v: state.ebl ? state.ebl.rng.toFixed(2) + " NM" : "OFF" },
      { l: "VECT", v: (state.vecMode === "R" ? "REL" : "TRUE") + " · " + state.vecMin + " MIN" },
      { l: "TRAILS", v: state.trails ? "TRUE · " + (state.trails < 60 ? state.trails + " S" : state.trails / 60 + " MIN") : "OFF" },
      { l: "LIMITS", v: "CPA " + state.cpaLim.toFixed(1) + " NM · " + state.tcpaLim + " MIN", small: true },
      { l: "STATUS", v: dangerAny ? "⚠ DANGER TGT" : (state.gz ? "GZ ARMED" : "NORMAL"), col: dangerAny ? DANGER : null }
    ], 208);

    // STBY-tekst
    if (!state.tx) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "800 30px Inter, sans-serif";
      ctx.fillStyle = PALC[state.pal].txt;
      ctx.fillText("STAND-BY", CX, CY - 12);
      ctx.font = "700 11px Inter, sans-serif";
      ctx.fillStyle = PALC[state.pal].dim;
      ctx.fillText("PRESS TX TO TRANSMIT", CX, CY + 16);
    }

    // alarmbanner
    var ua = unacked();
    if (ua && now % 800 < 480) {
      var msg = "⚠ " + ua.txt;
      ctx.font = "800 12px Inter, sans-serif";
      var tw = Math.max(240, ctx.measureText(msg).width + 40);
      ctx.fillStyle = ua.lvl === "danger" ? "rgba(200,40,30,0.92)" : "rgba(160,110,10,0.92)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(CX - tw / 2, 10, tw, 32, 8); else ctx.rect(CX - tw / 2, 10, tw, 32);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(msg, CX, 26);
    }

    // demo-merke nederst i skopfeltet
    ctx.font = "700 9px Inter, sans-serif";
    ctx.fillStyle = PALC[state.pal].dim;
    ctx.textAlign = "center";
    ctx.fillText("SIMULATOR — NOT FOR NAVIGATION", CX, H - 8);
  }

  function frame(ts) {
    var dt = Math.min(0.1, (ts - lastT) / 1000 || 0);
    lastT = ts;

    ownTick(dt);
    derivedTick(dt);
    targetsTick(dt);
    computeOrigin(0);

    if (state.auto) {
      state.gain = 0.70 + 0.05 * Math.sin(ts / 7000);
      state.sea = 0.32 + 0.06 * Math.sin(ts / 9000 + 2);
      state.rain = 0.10 + 0.05 * Math.sin(ts / 11000 + 4);
    }

    if (!landDirty && landRef) {
      if (landRef.range !== state.range || distNm(landRef, own) > state.range * 0.02) landDirty = true;
    }
    // Nye fliser samles opp i 250 ms for de utloser en ny landtegning, ellers
    // ville et flisdrag paa 48 stykker gitt 48 fulle opptegninger paa rad.
    if (landStamp && ts - landStamp > 250) { landStamp = 0; landDirty = true; }
    if (landDirty && ts >= landRetryAt) renderLand();

    if (state.tx) {
      var prev = sweep;
      sweep = (sweep + dt * (Math.PI * 2) / 2.5) % (Math.PI * 2);
      if (sweep < prev) { stampSector(prev, Math.PI * 2); stampSector(0, sweep); }
      else stampSector(prev, sweep);
    }

    echo.save();
    echo.setTransform(1, 0, 0, 1, 0, 0);
    echo.globalCompositeOperation = "destination-out";
    echo.fillStyle = "rgba(0,0,0," + Math.min(0.2, dt / 4.5) + ")";
    echo.fillRect(0, 0, echoC.width, echoC.height);
    echo.restore();

    overlay();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ================= Panellister (TT + alarmer) =================
  var _texts = {};
  function setText(id, value) {
    if (_texts[id] === value) return;
    _texts[id] = value;
    document.getElementById(id).textContent = value;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function renderLists() {
    assess();
    var rows = [], i, t, info;
    var activeTT = tts.filter(function (x) { return !x.lost; });
    for (i = 0; i < tts.length; i++) {
      var tt = tts[i];
      if (tt.lost) { rows.push('<div class="trow danger"><b>' + esc(tt.id) + " LOST</b><br><span class=\"sub\">" + esc(tt.key) + "</span></div>"); continue; }
      t = null;
      var list = targets();
      for (var j = 0; j < list.length; j++) if (list[j].name === tt.key) { t = list[j]; break; }
      if (!t) continue;
      info = cpaMap[tt.key] || evalTarget(t);
      var dgr = dangerMap[tt.key];
      rows.push('<div class="trow' + (dgr ? " danger" : "") + '"><b>' + esc(tt.id) + " · " + esc(tt.key) + "</b><br>" +
        "BRG " + info.brg.toFixed(1).padStart(5, "0") + "° · RNG " + info.rng.toFixed(2) + " NM<br>" +
        "<span class=\"sub\">CPA " + info.cpa.toFixed(2) + " NM · TCPA " + (info.tcpaMin != null && info.tcpaMin > 0 && info.tcpaMin < 99 ? info.tcpaMin.toFixed(1) + " MIN" : "—") + " · " + (t.sog || 0).toFixed(1) + " KN</span></div>");
    }
    if (state.ais) {
      // Bare fartoy i skopets naerhet (4x range) — en liste full av maal
      // hundrevis av nm unna ser ut som feil, ikke som AIS.
      var ais = targets().filter(function (x) { return x.name && !ttFor(x.name); })
        .map(function (x) { return { t: x, info: cpaMap[x.name] || evalTarget(x) }; })
        .filter(function (x) { return x.info.rng < state.range * 4; })
        .sort(function (a, b) { return a.info.rng - b.info.rng; })
        .slice(0, Math.max(0, 5 - rows.length));
      for (i = 0; i < ais.length; i++) {
        t = ais[i].t; info = ais[i].info;
        var dgr2 = dangerMap[t.name];
        rows.push('<div class="trow' + (dgr2 ? " danger" : "") + '"><b>AIS · ' + esc(t.name) + "</b><br>" +
          "BRG " + info.brg.toFixed(1).padStart(5, "0") + "° · RNG " + info.rng.toFixed(2) + " NM<br>" +
          "<span class=\"sub\">CPA " + info.cpa.toFixed(2) + " NM · TCPA " + (info.tcpaMin != null && info.tcpaMin > 0 && info.tcpaMin < 99 ? info.tcpaMin.toFixed(1) + " MIN" : "—") + "</span></div>");
      }
    }
    document.getElementById("ttList").innerHTML = rows.join("") || '<div class="trow"><span class="sub">No tracked targets — use ACQ TT and tap an echo.</span></div>';
    setText("ttCount", "TT " + activeTT.length + " · AIS " + (state.ais ? "ON" : "OFF"));
    renderAlarms();
    if (state.auto) {
      document.getElementById("gain").value = Math.round(state.gain * 100);
      document.getElementById("sea").value = Math.round(state.sea * 100);
      document.getElementById("rain").value = Math.round(state.rain * 100);
      setText("gainOut", String(Math.round(state.gain * 100)));
      setText("seaOut", String(Math.round(state.sea * 100)));
      setText("rainOut", String(Math.round(state.rain * 100)));
    }
  }
  function renderAlarms() {
    var rows = alarms.map(function (a) {
      var cls = a.lvl === "danger" ? "danger" : a.lvl === "warn" ? "warn" : "";
      var hh = new Date(a.t);
      var ts = String(hh.getHours()).padStart(2, "0") + ":" + String(hh.getMinutes()).padStart(2, "0");
      return '<div class="arow ' + cls + (a.ack ? "" : " unack") + '">' + ts + " · " + esc(a.txt) + "</div>";
    });
    document.getElementById("alList").innerHTML = rows.join("") || '<div class="arow">No active alerts</div>';
  }
  setInterval(renderLists, 650);
  renderLists();

  // ================= Kontroller =================
  function bindTap(el, fn) { el.addEventListener("pointerup", function (e) { e.preventDefault(); fn(); }); }
  function byId(id) { return document.getElementById(id); }

  function updateRange() {
    setText("rngVal", state.range < 1 ? state.range.toFixed(2) : String(state.range));
    setText("ringVal", state.rings ? "RINGS " + (state.range / 4).toFixed(state.range < 3 ? 2 : 1) + " NM" : "RINGS OFF");
  }
  bindTap(byId("rngUp"), function () {
    var i = RANGES.indexOf(state.range);
    if (i < RANGES.length - 1) { state.range = RANGES[i + 1]; tmA = state.motion === "TM" ? { lat: own.lat, lon: own.lon } : null; landDirty = true; echoClear(); }
    updateRange();
  });
  bindTap(byId("rngDn"), function () {
    var i = RANGES.indexOf(state.range);
    if (i > 0) { state.range = RANGES[i - 1]; tmA = state.motion === "TM" ? { lat: own.lat, lon: own.lon } : null; landDirty = true; echoClear(); }
    updateRange();
  });
  updateRange();

  bindTap(byId("txBtn"), function () {
    state.tx = !state.tx;
    byId("txBtn").classList.toggle("on", state.tx);
    byId("txBtn").childNodes[0].textContent = state.tx ? "TX" : "STBY";
    byId("txSub").textContent = state.tx ? "Transmit" : "Stand-by";
    addAlarm(state.tx ? "TRANSMIT ON" : "STAND-BY", "info");
  });
  bindTap(byId("plsBtn"), function () {
    var i = (PULSES.indexOf(state.pulse) + 1) % PULSES.length;
    state.pulse = PULSES[i];
    byId("plsBtn").childNodes[0].textContent = state.pulse;
  });
  bindTap(byId("palBtn"), function () {
    state.pal = state.pal === "GRN" ? "AMB" : "GRN";
    byId("palBtn").childNodes[0].textContent = state.pal;
    document.documentElement.dataset.pal = state.pal;
    landDirty = true;
    echoClear();
  });

  var orientBtn = byId("orientBtn");
  bindTap(orientBtn, function () {
    state.orient = state.orient === "N" ? "H" : state.orient === "H" ? "C" : "N";
    if (state.orient === "C") cupRef = own.cog;
    orientBtn.textContent = state.orient + "-UP";
    echoClear();
  });
  var motionBtn = byId("motionBtn");
  bindTap(motionBtn, function () {
    state.motion = state.motion === "RM" ? "TM" : "RM";
    tmA = state.motion === "TM" ? { lat: own.lat, lon: own.lon } : null;
    motionBtn.textContent = state.motion;
    motionBtn.classList.toggle("on", state.motion === "TM");
    echoClear();
  });
  var ocBtn = byId("ocBtn");
  bindTap(ocBtn, function () {
    state.offcenter = !state.offcenter;
    ocBtn.classList.toggle("on", state.offcenter);
    echoClear();
  });
  var ringsBtn = byId("ringsBtn");
  bindTap(ringsBtn, function () {
    state.rings = !state.rings;
    ringsBtn.classList.toggle("on", state.rings);
    updateRange();
  });
  var trailsBtn = byId("trailsBtn");
  bindTap(trailsBtn, function () {
    var i = (TRAILS.indexOf(state.trails) + 1) % TRAILS.length;
    state.trails = TRAILS[i];
    trailDots.length = 0;
    trailsBtn.classList.toggle("on", state.trails > 0);
    byId("trailsSub").textContent = state.trails === 0 ? "off" : state.trails < 60 ? state.trails + " s" : state.trails / 60 + " min";
  });
  var vectBtn = byId("vectBtn");
  bindTap(vectBtn, function () {
    // REL 3 → REL 6 → REL 12 → TRUE 3 → TRUE 6 → TRUE 12 → …
    var ti = VECMIN.indexOf(state.vecMin);
    if (ti === VECMIN.length - 1) { state.vecMode = state.vecMode === "R" ? "T" : "R"; state.vecMin = VECMIN[0]; }
    else state.vecMin = VECMIN[ti + 1];
    vectBtn.childNodes[0].textContent = "VECT " + (state.vecMode === "R" ? "REL" : "TRUE");
    byId("vectSub").textContent = state.vecMin + " min";
  });

  function setMode(m) {
    state.mode = m;
    byId("modeCurs").classList.toggle("on", m === "curs");
    byId("modeEbl").classList.toggle("on", m === "ebl");
    byId("modeAcq").classList.toggle("on", m === "acq");
  }
  bindTap(byId("modeCurs"), function () { setMode("curs"); });
  bindTap(byId("modeEbl"), function () { setMode("ebl"); });
  bindTap(byId("modeAcq"), function () { setMode("acq"); });
  bindTap(byId("clrEbl"), function () { state.ebl = null; });
  bindTap(byId("clrTT"), function () {
    if (tts.length) addAlarm("ALL TT CANCELLED", "info");
    tts = [];
  });

  var aisBtn = byId("aisBtn");
  bindTap(aisBtn, function () {
    state.ais = !state.ais;
    aisBtn.classList.toggle("on", state.ais);
  });
  var gzBtn = byId("gzBtn");
  bindTap(gzBtn, function () {
    state.gz = !state.gz;
    gzInside = {};
    gzBtn.classList.toggle("on", state.gz);
    addAlarm(state.gz ? "GUARD ZONE ARMED 0.5–0.7 R" : "GUARD ZONE OFF", "info");
  });
  bindTap(byId("ackBtn"), function () {
    for (var i = 0; i < alarms.length; i++) alarms[i].ack = true;
    renderAlarms();
  });

  function stepLim(key, d, el, unit, min, max, dec) {
    state[key] = Math.round(Math.min(max, Math.max(min, state[key] + d)) * 10) / 10;
    setText(el, (dec ? state[key].toFixed(1) : String(state[key])) + " " + unit);
  }
  bindTap(byId("cpaDn"), function () { stepLim("cpaLim", -0.1, "cpaVal", "NM", 0.1, 2, true); });
  bindTap(byId("cpaUp"), function () { stepLim("cpaLim", 0.1, "cpaVal", "NM", 0.1, 2, true); });
  bindTap(byId("tcpaDn"), function () { stepLim("tcpaLim", -1, "tcpaVal", "MIN", 1, 15, false); });
  bindTap(byId("tcpaUp"), function () { stepLim("tcpaLim", 1, "tcpaVal", "MIN", 1, 15, false); });

  function bindSlider(id, key) {
    var el = byId(id), out = byId(id + "Out");
    el.addEventListener("input", function () { if (state.auto) return; state[key] = this.value / 100; out.textContent = this.value; });
  }
  bindSlider("gain", "gain"); bindSlider("sea", "sea"); bindSlider("rain", "rain");

  var autoBtn = byId("autoBtn");
  bindTap(autoBtn, function () {
    state.auto = !state.auto;
    autoBtn.classList.toggle("on", state.auto);
    byId("tuneBox").classList.toggle("auto", state.auto);
    setText("tuneStat", state.auto ? "A/C AUTO" : "AUTOTUNE OK");
  });
  var irBtn = byId("irBtn");
  bindTap(irBtn, function () {
    state.ir = !state.ir;
    irBtn.classList.toggle("on", state.ir);
  });
  var esBtn = byId("esBtn");
  bindTap(esBtn, function () {
    state.es = !state.es;
    esBtn.classList.toggle("on", state.es);
  });

  // ================= Skop-interaksjon (cursor / EBL / ACQ) =================
  var dragging = false;
  function insideScope(e) { return Math.hypot(e.clientX - CX, e.clientY - CY) <= R; }
  function applyPoint(e, isDown) {
    var br = screenToBR(e.clientX, e.clientY);
    if (br.rng > state.range * 1.9) return;
    state.cursor = br;
    if (state.mode === "ebl") state.ebl = { brg: br.brg, rng: br.rng };
    if (state.mode === "acq" && isDown) acquireAt(br.brg, br.rng);
  }
  scope.addEventListener("pointerdown", function (e) {
    if (!insideScope(e)) return;
    dragging = true;
    try { scope.setPointerCapture(e.pointerId); } catch (x) {}
    applyPoint(e, true);
  });
  scope.addEventListener("pointermove", function (e) {
    if (dragging) applyPoint(e, false);
    else if (e.pointerType === "mouse" && insideScope(e)) { var br = screenToBR(e.clientX, e.clientY); if (br.rng <= state.range * 1.9) state.cursor = br; }
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    scope.addEventListener(ev, function () { dragging = false; });
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  addAlarm("RADAR READY — X-BAND SIMULATOR", "info");

  // Debug-/supporthandtak (samme moenster som window.__ecdis i kartet).
  window.__radar = {
    get own() { return own; },
    targets: targets,
    get anchor() { return anchor; },
    get syncAgeMs() { return syncAgeMs(); },
    get following() { return following(); },
    get aisAt() { return aisAt; },
    get aisState() { return aisState; },
    state: state
  };
})();
</script>
</body>
</html>
